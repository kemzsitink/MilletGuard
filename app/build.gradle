plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }
def signingValue = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
def releaseSigning = [
        storeFile    : signingValue('storeFile', 'SIGNING_STORE_FILE'),
        storePassword: signingValue('storePassword', 'SIGNING_STORE_PASSWORD'),
        keyAlias     : signingValue('keyAlias', 'SIGNING_KEY_ALIAS'),
        keyPassword  : signingValue('keyPassword', 'SIGNING_KEY_PASSWORD'),
]

android {
    namespace 'io.github.kemzsitink.milletguard'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "io.github.kemzsitink.milletguard"
        // Material 3 Expressive (material3 1.5.0) requires API 24. HyperOS 3 is Android 15+.
        minSdk 24
        targetSdk 22
        versionCode 20100
        versionName "2.1.0"
    }

    signingConfigs {
        // Release signing comes from keystore.properties (local) or SIGNING_* env vars (CI).
        // Without either, release builds fall back to the debug key so anyone can build.
        release {
            storeFile releaseSigning.storeFile ? rootProject.file(releaseSigning.storeFile) : null
            storePassword releaseSigning.storePassword
            keyAlias releaseSigning.keyAlias
            keyPassword releaseSigning.keyPassword
        }
    }

    buildTypes {
        release {
            signingConfig releaseSigning.storeFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    // The APK is never uploaded to Google Play, the only consumer of this encrypted
    // dependency report. F-Droid / IzzyOnDroid scanners flag it as an opaque blob.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        // targetSdk 22 is deliberate: it lets WRITE_SETTINGS edit Xiaomi's private
        // Settings.System whitelist (see AndroidManifest.xml). The app is not on Play.
        disable 'ExpiredTargetSdkVersion'
        // Distributed as a plain APK, never as an app bundle with language splits.
        disable 'AppBundleLocaleChanges'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    // Expressive components (LoadingIndicator, ButtonGroup, MaterialShapes, ...) only ship
    // in the 1.5 line; pinned so builds stay reproducible.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha29'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'

    testImplementation 'junit:junit:4.13.2'
}
