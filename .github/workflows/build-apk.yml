name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # Actions -> Build APK -> Run workflow, with "publish" ticked, releases the chosen branch
  # as v<versionName> (the tag is created at that commit), for when pushing a tag is not an option.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release v<versionName> from this branch
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships the Android SDK; install the exact packages we need.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Releases must always be signed with the same key, or installed apps cannot update.
      # The key lives in repository secrets; builds without it fall back to the debug key.
      - name: Restore release signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p ci-signing
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > ci-signing/release.keystore
            echo "SIGNING_STORE_FILE=ci-signing/release.keystore" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = true ]; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release."
            exit 1
          else
            echo "::warning::No signing secret; this build uses the debug key and is for testing only."
          fi

      - name: Test, lint and build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION"
            exit 1
          fi
          APK="MilletGuard-v${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: MilletGuard-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore

      # On a tag push the tag already exists (and matches versionName, checked above);
      # from "Run workflow" gh creates it at the commit that was built.
      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.apk.outputs.version }}
          APK: ${{ steps.apk.outputs.name }}
        run: |
          cp "$APK" MilletGuard.apk
          gh release create "$TAG" "$APK" MilletGuard.apk \
            --target "$GITHUB_SHA" \
            --title "MilletGuard $TAG" \
            --generate-notes
